{% macro avatar(username, size=40) %}
    {% set colors = ['#4f8cff', '#ff5c5c', '#ffb020', '#28c76f', '#8e44ad', '#3498db'] %}
    {% set color = colors[username|length % colors|length] %}
    <div class="avatar-small" style="width: {{ size }}px; height: {{ size }}px; background: {{ color }};">
        {{ username[0]|upper }}
    </div>
{% endmacro %}
